name: Release Chrome Extension

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Set release version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG; expected MAJOR.MINOR.PATCH with an optional leading v." >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          for component in "$major" "$minor" "$patch"; do
            if (( component > 65535 )); then
              echo "Version component exceeds Chrome's limit: $component" >&2
              exit 1
            fi
          done

          pnpm pkg set "version=$version"

      - name: Build release ZIP
        run: pnpm zip

      - name: Verify release metadata and ZIP
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          archive="output/tab-sense-${tag_version}-chrome.zip"
          if [[ ! -f "$archive" ]]; then
            echo "Expected release archive was not created: $archive" >&2
            exit 1
          fi

          unzip -t "$archive"

          manifest_version="$(
            unzip -p "$archive" manifest.json |
              node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync(0, 'utf8')).version)"
          )"
          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "ZIP manifest version $manifest_version does not match tag $RELEASE_TAG." >&2
            exit 1
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
              --generate-notes \
              --title "Tab Sense $RELEASE_TAG" \
              --verify-tag
          fi
