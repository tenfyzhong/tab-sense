name: Release Browser Extensions

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Set release version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG; expected MAJOR.MINOR.PATCH with an optional leading v." >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          for component in "$major" "$minor" "$patch"; do
            if (( component > 65535 )); then
              echo "Version component exceeds Chromium's limit: $component" >&2
              exit 1
            fi
          done

          pnpm pkg set "version=$version"

      - name: Build release ZIPs
        run: |
          pnpm zip:chrome
          pnpm zip:edge
          pnpm zip:firefox

      - name: Verify release metadata and ZIPs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          release_archives=(
            "output/tab-sense-${tag_version}-chrome.zip"
            "output/tab-sense-${tag_version}-edge.zip"
            "output/tab-sense-${tag_version}-firefox.zip"
          )
          firefox_sources="output/tab-sense-${tag_version}-sources.zip"

          for archive in "${release_archives[@]}"; do
            if [[ ! -f "$archive" ]]; then
              echo "Expected release archive was not created: $archive" >&2
              exit 1
            fi

            unzip -t "$archive"

            manifest_version="$(
              unzip -p "$archive" manifest.json |
                node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync(0, 'utf8')).version)"
            )"
            if [[ "$manifest_version" != "$tag_version" ]]; then
              echo "ZIP manifest version $manifest_version does not match tag $RELEASE_TAG." >&2
              exit 1
            fi
          done

          if [[ ! -f "$firefox_sources" ]]; then
            echo "Expected Firefox source archive was not created: $firefox_sources" >&2
            exit 1
          fi

          unzip -t "$firefox_sources"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          release_archives=(
            "output/tab-sense-${tag_version}-chrome.zip"
            "output/tab-sense-${tag_version}-edge.zip"
            "output/tab-sense-${tag_version}-firefox.zip"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_archives[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_archives[@]}" \
              --generate-notes \
              --title "Tab Sense $RELEASE_TAG" \
              --verify-tag
          fi

      - name: Submit Firefox and Edge updates
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"

          pnpm exec wxt submit \
            --firefox-channel listed \
            --firefox-compatibility firefox \
            --firefox-zip "output/tab-sense-${tag_version}-firefox.zip" \
            --firefox-sources-zip "output/tab-sense-${tag_version}-sources.zip" \
            --edge-zip "output/tab-sense-${tag_version}-edge.zip"
